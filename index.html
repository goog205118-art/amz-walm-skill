<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电商 Skill 工作台</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./skills.manifest.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <div class="brand-title">电商 Skill 工作台</div>
            <div class="brand-subtitle">内部电商 AI 能力封装工具</div>
          </div>
        </div>
        <div class="toolbar">
          <button id="settingsBtn" class="btn primary">设置</button>
          <button id="newSessionBtn" class="btn">新建会话</button>
          <button id="exportBtn" class="btn">导出工作区</button>
          <label class="btn file-btn">
            导入工作区
            <input id="importInput" type="file" accept="application/json" />
          </label>
          <label class="btn file-btn">
            导入 Skill
            <input id="skillImportInput" type="file" accept=".md,.txt,text/markdown,text/plain" multiple />
          </label>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel sidebar">
          <section class="section filter-section">
            <div class="section-head">
              <h2>技能导航</h2>
              <span id="skillCount" class="count"></span>
            </div>
            <label class="field search">
              <span>搜索</span>
              <input id="searchInput" type="search" placeholder="搜索技能 / 平台 / 关键词" />
            </label>
            <details class="filter-drawer">
              <summary>筛选</summary>
              <div id="categoryTabs" class="tabs"></div>
              <div id="platformTabs" class="tabs subtle"></div>
            </details>
          </section>

          <section class="section grow library-section">
            <div class="section-head">
              <h2>全部 Skills</h2>
            </div>
            <div id="skillList" class="list"></div>
          </section>

          <details class="section session-drawer" open>
            <summary class="section-head">
              <h2>会话</h2>
            </summary>
            <div id="sessionList" class="list compact"></div>
          </details>
        </aside>

        <section class="panel chat-panel">
          <div class="chat-head">
            <div>
              <div id="activeSkillName" class="chat-title"></div>
              <div id="activeSkillMeta" class="chat-meta"></div>
            </div>
            <div class="status-row">
              <span id="storageState" class="badge"></span>
              <span id="apiState" class="badge"></span>
            </div>
          </div>

          <div id="messageList" class="message-list"></div>

          <div class="composer">
            <div id="quickPrompts" class="quick-prompts"></div>
            <textarea id="messageInput" rows="5" placeholder="输入业务背景、数据、目标或直接提问..."></textarea>
            <div class="composer-actions">
              <button id="clearBtn" class="btn ghost">清空输入</button>
              <button id="sendBtn" class="btn primary">发送</button>
            </div>
          </div>
        </section>

        <aside class="panel inspector">
          <details class="section collapsible" open>
            <summary class="section-head">
              <h2>技能说明</h2>
            </summary>
            <div id="skillBrief" class="brief"></div>
          </details>

          <details class="section collapsible">
            <summary class="section-head">
              <h2>核心能力</h2>
            </summary>
            <ul id="capabilityList" class="bullets"></ul>
          </details>

          <details class="section collapsible">
            <summary class="section-head">
              <h2>执行流程</h2>
            </summary>
            <ol id="workflowList" class="steps"></ol>
          </details>

          <details class="section collapsible" open>
            <summary class="section-head">
              <h2>路由状态</h2>
            </summary>
            <div id="routingNote" class="note"></div>
          </details>

          <details class="section collapsible" open>
            <summary class="section-head">
              <h2>工作区</h2>
            </summary>
            <div id="workspaceStats" class="stat-grid"></div>
          </details>
        </aside>
      </main>

      <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button class="modal-backdrop" type="button" data-close-settings aria-label="关闭设置"></button>
        <section class="settings-card" role="document">
          <div class="modal-head">
            <div>
              <h2 id="settingsTitle">模型与接口设置</h2>
              <p>配置会保存到当前浏览器缓存，仅本机使用。</p>
            </div>
            <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="关闭设置">×</button>
          </div>

          <div class="settings-grid">
            <label class="field">
              <span>当前模型</span>
              <select id="modelInput"></select>
            </label>
            <label class="field">
              <span>模型池</span>
              <textarea id="modelListInput" rows="5" placeholder="每行一个模型，例如 gpt-4.1-mini"></textarea>
            </label>
            <label class="field">
              <span>API 密钥</span>
              <input id="apiKeyInput" type="password" placeholder="sk-..." />
            </label>
            <label class="field">
              <span>接口地址</span>
              <input id="endpointInput" type="url" />
            </label>
          </div>

          <div class="settings-actions">
            <button data-close-settings class="btn" type="button">取消</button>
            <button id="saveSettingsBtn" class="btn primary" type="button">保存设置</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
