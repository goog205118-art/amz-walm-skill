<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电商 Skill 工作台</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./skills.manifest.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <div class="brand-title">电商 Skill 工作台</div>
            <div class="brand-subtitle">内部电商 AI 能力封装工具</div>
          </div>
        </div>
        <div class="toolbar">
          <button id="settingsBtn" class="tool-btn primary" type="button" aria-label="设置" data-tooltip="设置">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2.1 2.1 0 0 1-2.97 2.97l-.04-.04a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.1 1.66V21.3a2.1 2.1 0 0 1-4.2 0v-.06a1.8 1.8 0 0 0-1.1-1.66 1.8 1.8 0 0 0-1.98.36l-.04.04a2.1 2.1 0 0 1-2.97-2.97l.04-.04A1.8 1.8 0 0 0 3.8 15a1.8 1.8 0 0 0-1.66-1.1H2.1a2.1 2.1 0 0 1 0-4.2h.06A1.8 1.8 0 0 0 3.82 8a1.8 1.8 0 0 0-.36-1.98l-.04-.04A2.1 2.1 0 0 1 6.39 3l.04.04a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 9.5 1.75V1.7a2.1 2.1 0 0 1 4.2 0v.06a1.8 1.8 0 0 0 1.1 1.66 1.8 1.8 0 0 0 1.98-.36l.04-.04a2.1 2.1 0 0 1 2.97 2.97l-.04.04A1.8 1.8 0 0 0 19.4 8c.18.64.7 1.1 1.36 1.1h.14a2.1 2.1 0 0 1 0 4.2h-.14A1.8 1.8 0 0 0 19.4 15Z"/></svg>
            </span>
          </button>
          <button id="newSessionBtn" class="tool-btn" type="button" aria-label="新建会话" data-tooltip="新建会话">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </span>
          </button>
          <button id="exportBtn" class="tool-btn" type="button" aria-label="导出工作区" data-tooltip="导出工作区">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M5 18.5h14"/></svg>
            </span>
          </button>
          <label class="tool-btn file-btn" tabindex="0" aria-label="导入工作区" data-tooltip="导入工作区">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21V10"/><path d="m7.5 14.5 4.5-4.5 4.5 4.5"/><path d="M5 5.5h14"/></svg>
            </span>
            <input id="importInput" type="file" accept="application/json" />
          </label>
          <label class="tool-btn file-btn" tabindex="0" aria-label="导入 Skill" data-tooltip="导入 Skill">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/><path d="M5 20h14"/><path d="M6.5 4.5h4"/></svg>
            </span>
            <input id="skillImportInput" type="file" accept=".md,.txt,text/markdown,text/plain" multiple />
          </label>
        </div>
      </header>

      <main id="workspace" class="workspace">
        <aside class="panel sidebar">
          <div class="panel-toggle-row">
            <button id="leftPanelToggle" class="rail-toggle" type="button" aria-label="收起技能栏">‹</button>
            <span>技能</span>
          </div>
          <div class="side-content">
            <section class="section filter-section">
              <div class="section-head">
                <h2>技能导航</h2>
                <span id="skillCount" class="count"></span>
              </div>
              <label class="field search">
                <span>搜索</span>
                <input id="searchInput" type="search" placeholder="搜索技能 / 平台 / 关键词" />
              </label>
              <details class="filter-drawer">
                <summary>筛选</summary>
                <div id="categoryTabs" class="tabs"></div>
                <div id="platformTabs" class="tabs subtle"></div>
              </details>
            </section>

            <section class="section grow library-section">
              <div class="section-head">
                <h2>全部 Skills</h2>
              </div>
              <div id="skillList" class="list"></div>
            </section>

            <details class="section session-drawer" open>
              <summary class="section-head">
                <h2>会话</h2>
              </summary>
              <div id="sessionList" class="list compact"></div>
            </details>
          </div>
        </aside>

        <section id="chatPanel" class="panel chat-panel">
          <div class="chat-head">
            <div>
              <div id="activeSkillName" class="chat-title"></div>
              <div id="activeSkillMeta" class="chat-meta"></div>
            </div>
            <div class="status-row">
              <span id="storageState" class="badge"></span>
              <span id="apiState" class="badge"></span>
            </div>
          </div>

          <div id="messageList" class="message-list"></div>

          <div class="composer">
            <div id="attachmentTray" class="attachment-tray hidden"></div>
            <div class="composer-box">
              <textarea id="messageInput" rows="1" placeholder="输入业务背景、数据、目标或直接提问，可拖入图片/文件..."></textarea>
              <div class="composer-tools">
                <select id="composerModelSelect" class="composer-model" title="切换模型" aria-label="切换模型"></select>
                <button id="sendBtn" class="send-icon" type="button" aria-label="发送">发送</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel inspector">
          <div class="panel-toggle-row">
            <button id="rightPanelToggle" class="rail-toggle" type="button" aria-label="收起说明栏">›</button>
            <span>说明</span>
          </div>
          <div class="side-content">
            <details class="section collapsible" open>
              <summary class="section-head">
                <h2>技能说明</h2>
              </summary>
              <div id="skillBrief" class="brief"></div>
            </details>

            <details class="section collapsible">
              <summary class="section-head">
                <h2>核心能力</h2>
              </summary>
              <ul id="capabilityList" class="bullets"></ul>
            </details>

            <details class="section collapsible">
              <summary class="section-head">
                <h2>执行流程</h2>
              </summary>
              <ol id="workflowList" class="steps"></ol>
            </details>

            <details class="section collapsible" open>
              <summary class="section-head">
                <h2>路由状态</h2>
              </summary>
              <div id="routingNote" class="note"></div>
            </details>

            <details class="section collapsible" open>
              <summary class="section-head">
                <h2>工作区</h2>
              </summary>
              <div id="workspaceStats" class="stat-grid"></div>
            </details>
          </div>
        </aside>
      </main>

      <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button class="modal-backdrop" type="button" data-close-settings aria-label="关闭设置"></button>
        <section class="settings-card" role="document">
          <div class="modal-head">
            <div>
              <h2 id="settingsTitle">模型与接口设置</h2>
              <p>配置会保存到当前浏览器缓存，仅本机使用。</p>
            </div>
            <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="关闭设置">×</button>
          </div>

          <div class="settings-grid">
            <label class="field">
              <span>接口协议</span>
              <select id="protocolInput">
                <option value="openai">OpenAI 协议 / 兼容接口</option>
                <option value="gemini">Gemini 协议</option>
                <option value="anthropic">Anthropic 协议</option>
              </select>
            </label>
            <label class="field">
              <span>当前模型</span>
              <select id="modelInput"></select>
            </label>
            <label class="field">
              <span>模型池</span>
              <textarea id="modelListInput" rows="5" placeholder="每行一个模型，例如 gpt-4.1-mini"></textarea>
            </label>
            <label class="field">
              <span>API 密钥</span>
              <input id="apiKeyInput" type="password" placeholder="sk-..." />
            </label>
            <label class="field">
              <span>接口地址</span>
              <input id="endpointInput" type="url" />
            </label>
          </div>

          <section class="capability-settings">
            <div class="settings-section-head">
              <h3>模型能力开关</h3>
              <p>用于 GPT 5.5 / Gemini 3.1 Pro 等多模态模型，关闭后会降级为文本摘要输入。</p>
            </div>
            <div class="toggle-grid">
              <label class="toggle-row">
                <input id="visionToggle" type="checkbox" />
                <span>图片识别</span>
              </label>
              <label class="toggle-row">
                <input id="fileTextToggle" type="checkbox" />
                <span>文件文本识别</span>
              </label>
              <label class="toggle-row">
                <input id="preserveAttachmentsToggle" type="checkbox" />
                <span>保留原始多模态输入</span>
              </label>
              <label class="toggle-row">
                <input id="longContextToggle" type="checkbox" />
                <span>长上下文</span>
              </label>
              <label class="toggle-row">
                <input id="reasoningToggle" type="checkbox" />
                <span>深度推理</span>
              </label>
              <label class="toggle-row">
                <input id="autoContextToggle" type="checkbox" />
                <span>自动压缩上下文</span>
              </label>
            </div>
          </section>

          <div class="settings-actions">
            <button data-close-settings class="btn" type="button">取消</button>
            <button id="saveSettingsBtn" class="btn primary" type="button">保存设置</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
